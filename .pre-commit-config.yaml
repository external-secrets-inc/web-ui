repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.3.0
  hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
      args: []
