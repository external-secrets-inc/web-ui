apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web-ui.fullname" . }}
  namespace: {{ template "web-ui.namespace" . }}
  labels:
    {{- include "web-ui.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen       80;
        server_name  localhost;

        location ^~ /docs {
          rewrite ^/docs/?(.*)$ /docs/$1 break;

          proxy_pass https://externalsecrets.mintlify.app/;
          proxy_set_header Host externalsecrets.mintlify.app;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_ssl_server_name on;


        # Rewrite Location headers in redirects
        proxy_redirect https://externalsecrets.mintlify.app/ /docs/;
        proxy_redirect / /docs/;

        # # Adjust cookie paths
        proxy_cookie_path / /docs/;

        # # Enable response content rewriting
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/' 'href="/docs/';
        sub_filter 'src="/' 'src="/docs/';
        sub_filter 'action="/' 'action="/docs/';
        sub_filter_once off;
        }

        # Proxy /_next/ assets
        location /_next/ {
            proxy_pass https://externalsecrets.mintlify.app/_next/;
            proxy_set_header Host externalsecrets.mintlify.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;

            # Optional: Cache control headers
            # Expires max;
            # add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
