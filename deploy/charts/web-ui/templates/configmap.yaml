apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web-ui.fullname" . }}
  namespace: {{ template "web-ui.namespace" . }}
  labels:
    {{- include "web-ui.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen       80;
        server_name  localhost;

        location ^~ /docs {
          proxy_pass https://imjusttesting.mintlify.app/;
          proxy_set_header Host docs.mintlify.app;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_ssl_server_name on;

          # Remove the /docs prefix before proxying
          rewrite ^/docs/?(.*)$ /$1 break;
        }


        location / {
            try_files $uri $uri/ /index.html;
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
