name: Build and Publish new release

on:
  release:
    types: [published]

env:
  NAME: web-ui
  TAG_NAME: ${{ github.event.release.tag_name }}
  TENANT_MANAGER_URL: https://api.prod.externalsecrets.com
  WEB_UI_URL: https://app.externalsecrets.com
  MOCK_AUDIT_ENABLED: "true"
  WEBSITE_URL: https://externalsecrets.com
  AUDIT_BACKEND_URL: https://audit.prod.externalsecrets.com
  ESO_SERVER_URL: https://eso-server.prod.externalsecrets.com
  DOCS_URL: https://app.externalsecrets.com
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ env.TAG_NAME }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Set up Google Cloud authentication
      id: auth
      uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: ${{ vars.DEV_IDENTITY_POOL }}
        service_account: ${{ vars.DEV_CI_SERVICE_ACCOUNT }}
        access_token_lifetime: 1500s


    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: us-central1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Build and push Docker image
      run: |
        docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=${{ vars.INTERNAL_REGISTRY}}/$NAME-cache:latest \
            --cache-to=type=registry,ref=${{ vars.INTERNAL_REGISTRY}}/$NAME-cache:latest,mode=max \
            --tag ${{ vars.INTERNAL_REGISTRY }}/$NAME:${{ env.TAG_NAME }} \
            --tag ${{ vars.INTERNAL_REGISTRY}}/$NAME:latest \
            --tag ${{ vars.PUBLIC_REGISTRY }}/$NAME:${{ env.TAG_NAME }} \
            --tag ${{ vars.PUBLIC_REGISTRY}}/$NAME:latest \
            --build-arg TENANT_MANAGER_URL=${{ env.TENANT_MANAGER_URL}} \
            --build-arg WEB_UI_URL=${{ env.WEB_UI_URL}} \
            --build-arg WEBSITE_URL=${{ env.WEBSITE_URL}} \
            --build-arg AUDIT_BACKEND_URL=${{ env.AUDIT_BACKEND_URL}} \
            --build-arg ESO_SERVER_URL=${{ env.ESO_SERVER_URL}} \
            --build-arg MOCK_AUDIT_ENABLED=${{ env.MOCK_AUDIT_ENABLED}} \
            --build-arg DOCS_URL=${{ env.DOCS_URL}} \
            --push .
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}


    - name: login to github app
      uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ vars.ESI_BOT_APP_ID }}
        private-key: ${{ secrets.ESI_BOT_PRIVATE_KEY }}
        repositories: "k8s-flux"
        owner: external-secrets-inc
  # Trigger workflow in k8s-flux
    - name: Trigger workflow in k8s-flux
      uses: peter-evans/repository-dispatch@v4
      with:
        repository: external-secrets-inc/k8s-flux
        event-type: update-version
        client-payload: '{"image_tag": "${{ env.TAG_NAME }}", "application": "${{ env.NAME }}", "environment": "prod"}'
        token: ${{ steps.app-token.outputs.token }}
