name: Build and Push to GCR

on:
  push:
    branches:
      - main

env:
  NAME: web-ui
  TENANT_MANAGER_URL: https://api.dev.externalsecrets.com
  WEB_UI_URL: https://app.dev.externalsecrets.com
  MOCK_AUDIT_ENABLED: "true"
  WEBSITE_URL: "#"
  AUDIT_BACKEND_URL: https://audit.dev.externalsecrets.com
  ESO_SERVER_URL: https://eso-server.dev.externalsecrets.com
  DOCS_URL: https://app.dev.externalsecrets.com
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Set up Google Cloud authentication
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        workload_identity_provider: ${{ vars.DEV_IDENTITY_POOL }}
        service_account: ${{ vars.DEV_CI_SERVICE_ACCOUNT }}
        access_token_lifetime: 1500s


    - name: Login to Artifact Registry
      uses: docker/login-action@v1
      with:
        registry: us-central1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Build and push Docker image
      run: |
        docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=${{ vars.INTERNAL_REGISTRY}}/$NAME-cache:latest \
            --cache-to=type=registry,ref=${{ vars.INTERNAL_REGISTRY}}/$NAME-cache:latest,mode=max \
            --tag ${{ vars.INTERNAL_REGISTRY}}/$NAME:$GITHUB_SHA \
            --tag ${{ vars.INTERNAL_REGISTRY}}/$NAME:latest \
            --tag ${{ vars.PUBLIC_REGISTRY}}/$NAME:$GITHUB_SHA \
            --tag ${{ vars.PUBLIC_REGISTRY}}/$NAME:latest \
            --build-arg TENANT_MANAGER_URL=${{ env.TENANT_MANAGER_URL}} \
            --build-arg WEB_UI_URL=${{ env.WEB_UI_URL}} \
            --build-arg WEBSITE_URL=${{ env.WEBSITE_URL}} \
            --build-arg AUDIT_BACKEND_URL=${{ env.AUDIT_BACKEND_URL}} \
            --build-arg ESO_SERVER_URL=${{ env.ESO_SERVER_URL}} \
            --build-arg MOCK_AUDIT_ENABLED=${{ env.MOCK_AUDIT_ENABLED}} \
            --build-arg DOCS_URL=${{ env.DOCS_URL}} \
            --push .
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

    - name: login to github app
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ vars.ESI_BOT_APP_ID }}
        private-key: ${{ secrets.ESI_BOT_PRIVATE_KEY }}
        repositories: "k8s-flux"
        owner: external-secrets-inc
  # Trigger workflow in k8s-flux
    - name: Trigger workflow in k8s-flux
      uses: peter-evans/repository-dispatch@v2
      with:
        repository: external-secrets-inc/k8s-flux
        event-type: update-version
        client-payload: '{"image_tag": "${{ github.sha }}", "application": "${{ env.NAME }}", "environment":"dev"}'
        token: ${{ steps.app-token.outputs.token }}
