name: Build and Push to GCR

on:
  push:
    branches:
      - main

env:
  NAME: web-ui
  TENANT_MANAGER_URL: https://api.dev.externalsecrets.com
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        driver: docker-container

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Set up Google Cloud authentication
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        workload_identity_provider: ${{ vars.DEV_IDENTITY_POOL }}
        service_account: ${{ vars.DEV_CI_SERVICE_ACCOUNT }}
        access_token_lifetime: 300s


    - name: Login to Artifact Registry
      uses: docker/login-action@v1
      with:
        registry: us-central1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Build and push Docker image
      run: |
        docker buildx build \
            --cache-from=type=registry,ref=${{ vars.INTERNAL_REGISTRY}}/$NAME-cache:latest \
            --cache-to=type=registry,ref=${{ vars.INTERNAL_REGISTRY}}/$NAME-cache:latest,mode=max \
            --tag ${{ vars.INTERNAL_REGISTRY}}/$NAME:$GITHUB_SHA \
            --tag ${{ vars.INTERNAL_REGISTRY}}/$NAME:latest \
            --build-arg TENANT_MANAGER_URL=${{ env.TENANT_MANAGER_URL}}
            --push .
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

    - uses: azure/setup-helm@v4.2.0
      with:
        version: 'latest'

    - name: Build and push helm chart
      run: make helm.push
